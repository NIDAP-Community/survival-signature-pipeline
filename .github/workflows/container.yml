name: Container validation

on:
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/container.yml'
      - 'container/**'
      - 'drivers/**'
      - 'src/**'
      - 'entrypoint.R'
      - 'renv.lock'
      - 'renv/**'
      - 'test_data/**'
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/workflows/container.yml'
      - 'container/**'
      - 'drivers/**'
      - 'src/**'
      - 'entrypoint.R'
      - 'renv.lock'
      - 'renv/**'
      - 'test_data/**'
  workflow_dispatch:

jobs:
  native-smoke-test:
    name: Native container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: container/build_docker.sh survival-signature-pipeline:ci
      - name: Run canonical smoke test
        run: container/smoke_test.sh survival-signature-pipeline:ci
