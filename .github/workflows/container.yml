name: Container validation

on:
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/container.yml'
      - 'container/**'
      - 'drivers/**'
      - 'src/**'
      - 'entrypoint.R'
      - 'renv.lock'
      - 'renv/**'
      - 'test_data/**'
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/workflows/container.yml'
      - 'container/**'
      - 'drivers/**'
      - 'src/**'
      - 'entrypoint.R'
      - 'renv.lock'
      - 'renv/**'
      - 'test_data/**'
  workflow_dispatch:

jobs:
  native-smoke-test:
    name: Native container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: container/build_docker.sh survival-signature-pipeline:ci
      - name: Run canonical smoke test
        run: container/smoke_test.sh survival-signature-pipeline:ci

  arm64-build:
    name: ARM64 container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 image without publishing
        run: >-
          docker buildx build
          --file container/Dockerfile
          --platform linux/arm64
          --build-arg VCS_REF=${{ github.sha }}
          --build-arg BUILD_DATE=${{ github.event.repository.updated_at }}
          --cache-to type=gha,mode=max
          --cache-from type=gha
          --output type=cacheonly
          .
